version: 2

updates:
  # GitHub Actions used by .github/workflows/**. Minor and patch bumps are
  # grouped into one weekly PR; majors stay ungrouped so each gets its own PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"
      include: "scope"

  # No `docker` entry yet: the Dockerfile pins openresty-opm to the base image's
  # exact openresty version, so a base-image bump alone breaks the build, and no
  # PR check builds the image to catch it before auto-merge.
