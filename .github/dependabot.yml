version: 2

updates:
  # Go modules. Minor and patch bumps are grouped into one weekly PR; majors
  # stay ungrouped so each gets its own PR.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions used by .github/workflows/**.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"
      include: "scope"
    ignore:
      # CruGlobal/.github majors are fleet-wide moves: v1 -> v2 would break the
      # parked v1 workflow, and the @v2 pipeline refs move only on purpose.
      - dependency-name: "CruGlobal/.github*"
        update-types: ["version-update:semver-major"]

  # Base images in the Dockerfile (literal tags, so Dependabot can read them).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build"
      include: "scope"
