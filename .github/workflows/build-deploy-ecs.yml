name: Build & Deploy ECS

on:
  # Parked v1 escape hatch. This app builds and deploys through pipeline-v2.yml;
  # restoring a push trigger would double-build every merge and push v1's
  # environment-specific tags alongside v2's candidates.
  workflow_dispatch:
    inputs:
      auto-deploy:
        type: boolean
        description: Deploy image after building?
        required: true
        default: 'false'

jobs:
  build:
    name: Build
    uses: CruGlobal/.github/.github/workflows/build-ecs.yml@v1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.auto-deploy == 'true'
    steps:
      - uses: CruGlobal/.github/actions/trigger-deploy@v1
        with:
          github-token: ${{ secrets.CRU_DEPLOY_GITHUB_TOKEN }}
          project-name: ${{ needs.build.outputs.project-name }}
          environment: ${{ needs.build.outputs.environment }}
          build-number: ${{ needs.build.outputs.build-number }}
