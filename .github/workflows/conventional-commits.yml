name: Conventional Commits

# Validates that the PR title is a valid Conventional Commit. Two reasons it
# matters on pipeline v2: the title becomes the commit subject on a squash merge,
# and the deploy changelog (deploys.cru.org/changelog) is read straight from the
# commit subjects between two releases — so a conventional title is what makes a
# promote's diff legible. Scope is optional (`feat:` and `feat(redirect):` both
# pass); `deps` and `ci` match the Dependabot prefixes in .github/dependabot.yml.
#
# The job name — "Validate PR Title" — is the required status check the
# pipeline-v2 branch ruleset expects. Renaming the job silently drops that gate.
#
# Deliberately carries no branch filter, so it reports on every pull request
# regardless of base branch.
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  semantic-pr:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            ci
            docs
            build
            deps
            perf
            refactor
            revert
            style
            test
